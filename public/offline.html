<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No signal</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 2rem; text-align: center; background: #f7f8fb; color: #1c2333;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) { body { background: #171a21; color: #f2f4f8; } }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1rem; max-width: 22rem; opacity: .75; }
      button {
        font: inherit; font-weight: 600; padding: .6rem 1.1rem; border-radius: .6rem;
        border: 0; background: #2f4fa8; color: #fff;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>No signal right now</h1>
      <p>
        Contacts you logged while offline are saved on this phone and will upload
        on their own once you are back in coverage. Nothing has been lost.
      </p>
      <button onclick="location.reload()">Try again</button>
      <p id="saved" hidden style="margin-top: 1.25rem">
        <a href="/canvass/offline">Open a walk list saved to this phone</a>
      </p>
      <script>
        // Only offer it when there is actually one saved, so the link never
        // leads to an empty page in the middle of a concession road. The check
        // reads the little index the app keeps beside the turfs themselves —
        // opening IndexedDB from here would create an empty database and stop
        // the app from ever making its own.
        try {
          var saved = JSON.parse(localStorage.getItem("campaign:offline-turfs:v1") || "[]");
          if (saved.length > 0) document.getElementById("saved").hidden = false;
        } catch (e) {}
      </script>
    </div>
  </body>
</html>
